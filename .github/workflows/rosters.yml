# NPB公式「選手一覧」から所属選手データを取得し、data/rosters.json を更新する
name: NPB所属選手データの更新

on:
  schedule:
    # 毎日 5:00 と 17:00（日本時間）
    - cron: '0 20 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 選手一覧を取得
        run: python3 scripts/fetch_rosters.py
      - name: 変更があればコミット
        run: |
          if git diff --quiet -- data/rosters.json; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rosters.json
          git commit -m "NPB所属選手データを更新"
          git push
